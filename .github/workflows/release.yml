name: Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  build:
    name: Build
    strategy:
      fail-fast: true
      matrix:
        container:
          - { os: "ubuntu-24.04", rust_target: "aarch64-unknown-linux-musl" }
          - { os: "ubuntu-24.04", rust_target: "x86_64-unknown-linux-musl" }
          - { os: "macos-15", rust_target: "x86_64-apple-darwin" }
          - { os: "macos-15", rust_target: "aarch64-apple-darwin" }
    runs-on: "${{ matrix.container.os }}"
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          target: "${{ matrix.container.rust_target }}"
          override: true
      - uses: actions-rs/cargo@v1
        with:
          use-cross: true
          command: build
          args: "--release --bin s3_cache --target ${{ matrix.container.rust_target }}"
      - name: Package binary
        run: |
          mkdir -p package
          cp target/${{ matrix.container.rust_target }}/release/s3_cache package/s3-cache-${{ matrix.container.rust_target }}
          cd package
          tar -czf ../s3-cache-${{ matrix.container.rust_target }}.tar.gz s3-cache-${{ matrix.container.rust_target }}
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: s3-cache-${{ matrix.container.rust_target }}
          path: s3-cache-${{ matrix.container.rust_target }}.tar.gz

  release:
    name: Release
    runs-on: ubuntu-24.04
    needs: ["build"]
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: binaries
      - name: Release
        uses: softprops/action-gh-release@v1
        with:
          fail_on_unmatched_files: true
          files: |
            binaries/*/*

  docker_build:
    name: Docker
    runs-on: ubuntu-24.04
    needs: ["build"]
    strategy:
      fail-fast: true
      matrix:
        container:
          - { arch: "arm64", rust_target: "aarch64-unknown-linux-musl" }
          - { arch: "amd64", rust_target: "x86_64-unknown-linux-musl" }
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
        id: buildx
        with:
          install: true
      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: binaries
      - name: Build and push
        run: |
          tar -xzf binaries/s3-cache-${{ matrix.container.rust_target }}/s3-cache-${{ matrix.container.rust_target }}.tar.gz -C binaries/s3-cache-${{ matrix.container.rust_target }}/
          cp binaries/s3-cache-${{ matrix.container.rust_target }}/s3-cache-${{ matrix.container.rust_target }} binary_s3_cache
          chmod +x binary_s3_cache
          docker buildx build -f Dockerfile.release -o type=docker --platform linux/${{ matrix.container.arch }} -t easybill/s3-cache:${{github.ref_name}}_${{ matrix.container.arch }} .
          docker push easybill/s3-cache:${{github.ref_name}}_${{ matrix.container.arch }}

  docker_manifest:
    name: Docker Image
    runs-on: ubuntu-24.04
    needs: ["docker_build"]
    steps:
      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and Push manifest
        run: |
          docker manifest create easybill/s3-cache:${{github.ref_name}} easybill/s3-cache:${{github.ref_name}}_amd64 easybill/s3-cache:${{github.ref_name}}_arm64
          docker manifest push easybill/s3-cache:${{github.ref_name}}
